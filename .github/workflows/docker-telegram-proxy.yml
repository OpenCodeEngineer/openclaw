name: Docker Telegram Proxy

on:
  push:
    branches:
      - feat/telegram-proxy-ingress
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Docker Builder
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}:telegram-proxy" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            OPENCLAW_EXTENSIONS=telegram
          cache-from: type=gha,scope=docker-telegram-proxy
          cache-to: type=gha,mode=max,scope=docker-telegram-proxy
          tags: ${{ steps.image.outputs.name }}
          provenance: false
          push: true

      - name: Print digest
        run: |
          echo "## Image Built" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.image.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "Digest: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
